spring.application.name=booking-system
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/booking_db?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
jwt.secret=${JWT_SECRET:Ni0H+ehYYBpa+eJDl/hrxe+sl9Zem1DcOezjtjdSeUQ=}
# JWT expiration corresponds to 24 hours in milliseconds
jwt.expiration=86400000