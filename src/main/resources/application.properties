spring.application.name=booking-system
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/booking_db?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
jwt.secret=${JWT_SECRET:local_dev_secret_key_which_must_be_at_least_256_bits_long}
# JWT expiration corresponds to 24 hours in milliseconds
jwt.expiration=86400000