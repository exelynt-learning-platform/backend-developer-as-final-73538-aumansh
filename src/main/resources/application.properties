spring.application.name=booking-system
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/booking_db?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:springuser}
spring.datasource.password=${DB_PASSWORD:springpass}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000
